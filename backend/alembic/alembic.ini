# A generic, single database configuration.

[alembic]
# path to migration scripts.
# Use forward slashes (/) also on windows
script_location = alembic

# The output encoding used for revision files.
output_encoding = utf-8

# The name of the database.
# Override with: DATABASE_URL env var or --x-url option
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/super_ai_ru


[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S