name: Deploy to Production (.66)

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 192.168.10.66 >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          ssh ruslan@192.168.10.66 "
            export PATH=\$PATH:/home/ruslan/.local/bin
            cd /mnt/data/super-ai
            git pull origin master
            source backend/venv/bin/activate
            pip install -q -r backend/requirements.txt --no-hashes 2>/dev/null || pip install -q -r backend/requirements.txt
            cd backend && alembic -c alembic/alembic.ini upgrade head
            pm2 restart super-ai-api
          "

      - name: Deploy frontend
        run: |
          rsync -avz --delete --exclude 'node_modules' --exclude '.next' --exclude '.git' --exclude 'venv' \
            ./frontend/ ruslan@192.168.10.66:/mnt/data/super-ai/frontend/
          ssh ruslan@192.168.10.66 "
            export PATH=\$PATH:/home/ruslan/.local/bin
            cd /mnt/data/super-ai/frontend
            npm ci --omit=dev
            npm run build
            pm2 restart super-ai-web
            pm2 save
          "

      - name: Health check
        run: |
          sleep 5
          curl -s -o /dev/null -w '%{http_code}' https://ai.strogov.com/ || echo 'Frontend check failed'
          curl -s -o /dev/null -w '%{http_code}' https://ai.strogov.com/api/v1/auth/login -X POST -H 'Content-Type: application/json' -d '{"email":"test@test.com","password":"test"}' || echo 'API check failed'